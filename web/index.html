<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EQ Camp — ระบบสร้างเอกสารกระบวนการขาย</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
if (typeof tailwind !== 'undefined') tailwind.config = {
  theme: { extend: {
    colors: {
      // โทนเดียว: กรมท่า (navy) + เทา Apple — สีเดียวทั้งระบบ
      brand: { ink: '#1D1D1F', navy: '#0C2A41', DEFAULT: '#0C2A41', sky: '#0C2A41', mist: '#E5E5EA' },
      sub: '#6E6E73',
      accent: { DEFAULT: '#C4641B', deep: '#A5530F', soft: '#F5EEE6' }, // ส้ม — ใช้เฉพาะปุ่มหลัก/สถานะ
      paper: '#F5F5F7'
    },
    fontFamily: {
      sans: ['IBM Plex Sans Thai', 'Noto Sans Thai', 'system-ui', 'sans-serif'],
      doc: ['Sarabun', 'TH Sarabun New', 'sans-serif'],
      display: ['Kanit', 'Sarabun', 'system-ui', 'sans-serif']
    },
    boxShadow: { card: '0 1px 2px rgba(0,0,0,.04)', lift: '0 2px 10px rgba(0,0,0,.07)' },
    borderRadius: { xl: '12px', '2xl': '12px' }
  } }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  /* UI ใช้ฟอนต์ไทยไร้หัวที่ออกแบบมาสำหรับหน้าจอ อ่านง่ายที่ขนาดเล็ก; ตัวเอกสาร (preview/PDF) ยังเป็น Sarabun/TH Sarabun New */
  body { background: #F5F5F7; color: #1D1D1F; font-size: 15px; line-height: 1.6; font-family: 'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Kanit','Sarabun',system-ui,sans-serif; }
  /* แถบหัวเว็บ: สีกรมท่าเรียบ สีเดียว ไม่มี gradient/เงาจัด */
  .brandbar { background: #0C2A41; }
  .tabrail::-webkit-scrollbar { height: 5px; }
  .tabrail::-webkit-scrollbar-thumb { background: #D1D1D6; border-radius: 999px; }
  @media (prefers-reduced-motion: no-preference) { .tap { transition: background-color .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease; } .tap:active { opacity: .85; } }
</style>
</head><body><div id="root"></div><script src="./bundle.js"></script></body></html>
